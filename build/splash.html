<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline';"
  />
  <title>Aether Desktop AI</title>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: #fff;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
    .card {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      place-content: center;
      justify-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 22px;
      background: #050505;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .62);
    }
    .card::before {
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 255, 255, .055);
      border-radius: 14px;
      content: "";
      pointer-events: none;
    }
    .wordmark {
      display: block;
      width: 244px;
      height: auto;
      filter: drop-shadow(0 10px 26px rgba(255, 255, 255, .05));
    }
    .tagline {
      margin: 12px 0 0;
      color: #8f8f8f;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .progress {
      position: relative;
      width: 220px;
      height: 3px;
      margin-top: 29px;
      overflow: hidden;
      border-radius: 99px;
      background: #202020;
    }
    .progress i {
      position: absolute;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #fff;
      animation: travel 1.35s ease-in-out infinite;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      color: #a0a0a0;
      font-size: 10px;
    }
    .status span {
      width: 7px;
      height: 7px;
      border: 1px solid #fff;
      border-radius: 50%;
      animation: pulse 1.35s ease-in-out infinite;
    }
    @keyframes travel {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(350%); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .35; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress i {
        width: 58%;
        animation: none;
      }
      .status span {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      class="wordmark"
      src="./assets/aether-wordmark-transparent.png"
      alt="Aether"
    />
    <p class="tagline">Workspace Intelligence</p>
    <div class="progress" aria-hidden="true"><i></i></div>
    <div class="status"><span aria-hidden="true"></span> Preparando ambiente seguro…</div>
  </main>
</body>
</html>
