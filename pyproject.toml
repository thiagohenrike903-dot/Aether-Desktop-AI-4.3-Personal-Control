[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-desktop-ai"
version = "4.3.0"
description = "Aether Desktop AI — local-first assistant with transparent operations, projects and safe automation."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
aether-core = "jarvis.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["python/requirements.txt"]}

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.packages.find]
where = ["python"]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
